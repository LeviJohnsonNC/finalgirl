name: Konrad rendered review
on:
  pull_request:
    paths:
      - 'src/components/play/Konrad*'
      - 'src/styles/play-konrad.css'
      - 'tests/browser/konrad.spec.ts'
      - '.github/workflows/konrad-review.yml'
permissions:
  contents: read
concurrency:
  group: konrad-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser -- tests/browser/konrad.spec.ts --project=${{ matrix.project }} --reporter=list
        env:
          KONRAD_REVIEW_LOGS: 1
