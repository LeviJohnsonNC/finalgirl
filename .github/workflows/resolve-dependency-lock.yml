name: Temporary dependency lock reconciliation
on: [pull_request]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export generated dependency metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = readFileSync('package-lock.json').toString('base64');
          for (let offset = 0; offset < data.length; offset += 8000) {
            console.log('LOCK_CHUNK:' + data.slice(offset, offset + 8000));
          }
          NODE
